
name: Build Island Universe APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: Upload ZIP proyek ke repository utama."
            exit 1
          fi
          mkdir source
          unzip -q "$ZIP" -d source
          find source -maxdepth 4 -type f | head -100

      - name: Locate Android project
        run: |
          ANDROID_DIR=$(find source -type f -name gradlew -print -quit | xargs -r dirname)
          if [ -z "$ANDROID_DIR" ]; then
            ANDROID_DIR=$(find source -type f -name settings.gradle -o -name settings.gradle.kts | head -n 1 | xargs -r dirname)
          fi
          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Proyek Android/Gradle tidak ditemukan."
            exit 1
          fi
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$ANDROID_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: island-universe-debug-apk
          path: |
            source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
